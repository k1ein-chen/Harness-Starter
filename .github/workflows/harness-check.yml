name: Harness Check
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Syntax check hooks and scripts
        run: |
          set -e
          find .claude/hooks scripts -name '*.mjs' -print0 | while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Run harness health check
        run: node scripts/check.mjs
      - name: Run tests
        run: npm test
